# Sobe o frontend (Nginx) + um backend construido a partir do repositorio
# gameeducator-backend (contexto Git remoto). Para usar um backend local:
#   BACKEND_CONTEXT=../../gameeducator-backend docker compose -f docker/docker-compose.yml up --build
# IMAGE_TAG: tag da imagem gameeducator-frontend (a pipeline define e sobe com --no-build).
name: gameeducator-frontend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameeducator
      POSTGRES_USER: gameeducator
      POSTGRES_PASSWORD: gameeducator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameeducator -d gameeducator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: gameeducator-backend:${BACKEND_IMAGE_TAG:-local}
    build:
      context: ${BACKEND_CONTEXT:-https://github.com/IHPNULL/gameeducator-backend.git#main}
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gameeducator
      DB_USER: gameeducator
      DB_PASSWORD: gameeducator
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: gameeducator-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8081:80"
